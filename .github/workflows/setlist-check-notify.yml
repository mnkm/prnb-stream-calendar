# セトリの点検の Issue が作られたら、リポジトリの持ち主にメンション付きのコメントを付けて通知する。
# Issue は Worker が持ち主のトークンで作るため、GitHub は「自分の操作」として通知しない。
# github-actions[bot] がメンションすることで、持ち主にメールなどの通知が届く
name: セトリの点検の通知

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify:
    if: contains(github.event.issue.labels.*.name, 'setlist-check')
    runs-on: ubuntu-latest
    steps:
      - name: 持ち主にメンションする
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
        run: gh issue comment "$ISSUE" --body "@$OWNER セトリの点検で、確認が必要な歌枠が見つかりました。"
